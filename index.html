<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Player</title>

<style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.player{
    background:#1e293b;
    padding:30px;
    border-radius:15px;
    text-align:center;
    width:300px;
}

button{
    margin:10px;
    padding:10px 20px;
    border:none;
    border-radius:10px;
    background:#38bdf8;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#0ea5e9;
}
</style>
</head>

<body>

<div class="player">
<h2>Somebody's Pleasure</h2>
<p>Aziz Hedra</p>

<audio id="music">
    <source src="somebody.mp3" type="audio/mpeg">
</audio>

<button onclick="playMusic()">Play</button>
<button onclick="pauseMusic()">Pause</button>

</div>

<script>
let music = document.getElementById("music");

function playMusic(){
    music.play();
}

function pauseMusic(){
    music.pause();
}
</script>

</body>
</html>
